# CI for chat-vault.
#
#   every push / PR:  lint + tests, secret scan, dependency audit,
#                     image build + vulnerability scan + stdio smoke test
#   tag v*.*.*:       all of the above, then a multi-arch push to Docker Hub
#
# Third-party actions are pinned to full commit SHAs (tag in the comment), so a
# moved or hijacked tag cannot change what runs here. Dependabot keeps them fresh.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# Least privilege by default; jobs widen this only where needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: arslanasadqazi/chat-vault

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned dependencies (hash-checked)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Lockfiles are in sync (requirements files are generated from uv.lock)
        run: |
          uv lock --check
          diff <(uv export --frozen --no-emit-project --no-header --format requirements-txt) <(tail -n +3 requirements.txt)
          diff <(uv export --frozen --no-emit-project --extra dev --no-header --format requirements-txt) <(tail -n +3 requirements-dev.txt)
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal-account repo: no GITLEAKS_LICENSE needed.

  dependencies:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          require-hashes: true

  image:
    name: image build + scan + smoke test
    runs-on: ubuntu-latest
    needs: [test, secrets, dependencies]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64, loaded locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: chat-vault:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chat-vault:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true # fail only on issues that have a fix available
          exit-code: "1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Stdio smoke test against the built image
        run: |
          pip install --require-hashes -r requirements-dev.txt
          python scripts/smoke_test_image.py chat-vault:ci
      - name: Image must not run as root
        run: test "$(docker image inspect chat-vault:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: HTTP mode smoke test (health OK, MCP without token is 401)
        run: |
          mkdir -p smoke/data smoke/secrets
          python -c "from pathlib import Path; from tests.helpers import build_sample_vault; build_sample_vault(Path('smoke/data/chat-vault.db'))"
          # Throwaway values generated for this run only.
          python -c "import secrets; print(secrets.token_urlsafe(48))" > smoke/secrets/jwt_signing_key
          python -c "import secrets; print(secrets.token_urlsafe(32))" > smoke/secrets/github_client_secret
          chmod -R a+rX smoke
          docker run -d --name http-smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8000:8000 \
            -v "$PWD/smoke/data:/data:ro" -v "$PWD/smoke/secrets:/run/secrets:ro" \
            -e CHAT_VAULT_MODE=http -e CHAT_VAULT_PUBLIC_URL=http://localhost:8000 \
            -e CHAT_VAULT_ALLOWED_GITHUB_USER_ID=1 -e GITHUB_CLIENT_ID=ci \
            -e GITHUB_CLIENT_SECRET_FILE=/run/secrets/github_client_secret \
            -e CHAT_VAULT_JWT_SIGNING_KEY_FILE=/run/secrets/jwt_signing_key \
            --tmpfs /state:uid=10001,gid=10001 chat-vault:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          test "$(curl -s http://127.0.0.1:8000/health)" = '{"status":"ok"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = "401"
          docker logs http-smoke
          docker rm -f http-smoke

  extension:
    name: desktop extension (.mcpb) build + validate
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build (validates the manifest, packs from an allow-list of files)
        run: python scripts/build_extension.py
      - name: The bundle must contain code only
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.mcpb")[0]).namelist()
          bad = [n for n in names if n.endswith((".db", ".zip", ".env")) or "secrets" in n or "conversations" in n]
          sys.exit(f"unexpected files in bundle: {bad}" if bad else 0)
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-vault-extension
          path: dist/*.mcpb
          retention-days: 14

  release:
    name: GitHub release with the desktop extension
    runs-on: ubuntu-latest
    needs: [image, extension]
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'arsalqazi3/Chat-Vault'
    permissions:
      contents: write # create the release and upload the .mcpb (this job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python scripts/build_extension.py
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.mcpb --title "$GITHUB_REF_NAME" --generate-notes

  publish:
    name: publish multi-arch image
    runs-on: ubuntu-latest
    needs: [image]
    # Only for version tags pushed to this repository (never for PRs or forks).
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'arsalqazi3/Chat-Vault'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain metadata: build provenance and a software bill of materials.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
